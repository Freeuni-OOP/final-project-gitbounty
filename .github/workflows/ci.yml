name: Run Tests and Verification

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

  frontend-build:
    name: Verify Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend/gitbounty

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/gitbounty/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Build (Typecheck + Vite compilation)
        run: npm run build