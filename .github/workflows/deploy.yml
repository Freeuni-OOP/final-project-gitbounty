name: Deploy to Production

on:
  push:
    branches:
      - main
      - develop

# Prevents race conditions if you push multiple commits rapidly
concurrency:
  group: development-deploy
  cancel-in-progress: false

jobs:
  # BUILD: Happens on GitHub's servers, not VPS
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the images so your compose file can find them
          tags: |
            ghcr.io/freeuni-oop/gitbounty-backend:${{ github.ref_name }}
            ghcr.io/freeuni-oop/gitbounty-frontend:${{ github.ref_name }} 

  # DEPLOY: Only runs if the Build job succeeds
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/gitbounty
            # Pull pre-built images (Fast and low RAM usage)
            docker compose pull
            # Start/Update containers
            docker compose up -d
            # Clean up dangling images to free space
            docker image prune -f