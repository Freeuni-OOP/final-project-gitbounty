name: Deploy to Production

on:
  push:
    branches:
      - main
      - develop
      - fix/UserControllerWithinDocker
  # This enables manual triggering
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'warning'

concurrency:
  group: development-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}
      # Add this step to create a safe tag name
      - name: Set Tag Name
        id: vars
        run: echo "safe_ref=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      #Required for caching images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-backend:${{ steps.vars.outputs.safe_ref }}

      - name: Build Frontend Artifacts
        run: |
          cd Frontend/gitbounty
          npm install
          npm run build

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/gitbounty
          file: ./Frontend/gitbounty/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-frontend:${{ steps.vars.outputs.safe_ref }}

      - name: Build and Push Keycloak
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./keycloak/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-keycloak:${{ steps.vars.outputs.safe_ref }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Copy docker-compose.yml
      - uses: appleboy/scp-action@master
      - with:
      - host: ${{ secrets.SERVER_HOST }}
      - username: ${{ secrets.SERVER_USER }}
      - key: ${{ secrets.SSH_PRIVATE_KEY }}
      - source: "./docker-compose.yml"
      - target: "/home/gitbounty"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/gitbounty
            echo -e "${{ secrets.ENV_FILE_CONTENT }}" > .env
            # Secure the file
            chmod 600 .env
            cat .env
            docker compose pull
            docker compose up -d
            docker image prune -f