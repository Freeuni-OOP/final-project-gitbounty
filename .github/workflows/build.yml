name: Build and Push
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Job 1: A quick initialization job to compute common variables
  setup:
    runs-on: ubuntu-latest
    outputs:
      safe_ref: ${{ steps.vars.outputs.safe_ref }}
    steps:
      - name: Set Tag Name
        id: vars
        run: echo "safe_ref=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

  # Job 2: Parallel matrix execution for all three Docker services
  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, keycloak]
        include:
          - service: backend
            context: ./Backend
            file: ./Backend/Dockerfile
          - service: frontend
            context: ./Frontend/gitbounty
            file: ./Frontend/gitbounty/Dockerfile
          - service: keycloak
            context: .
            file: ./keycloak/Dockerfile

    name: Build ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Cleaner and standard compared to 'x-access-token'
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file:  ${{ matrix.file }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-${{ matrix.service }}:${{ needs.setup.outputs.safe_ref }}