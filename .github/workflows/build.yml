name: Build and Push
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Tag Name
        id: vars
        run: echo "safe_ref=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-backend:${{ steps.vars.outputs.safe_ref }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/gitbounty
          file: ./Frontend/gitbounty/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-frontend:${{ steps.vars.outputs.safe_ref }}

      - name: Build and Push Keycloak
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./keycloak/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/freeuni-oop/gitbounty-keycloak:${{ steps.vars.outputs.safe_ref }}