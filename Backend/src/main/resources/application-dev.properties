# --- Database (Local MySQL) ---
# Ensure your local MySQL has a database named 'gitbounty'
spring.datasource.url= ${SPRING_DATASOURCE_URL}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Explicitly tell Flyway to use the SAME credentials
spring.flyway.user= ${SPRING_DATASOURCE_USERNAME}
spring.flyway.password= ${SPRING_DATASOURCE_PASSWORD}
spring.flyway.url= ${SPRING_DATASOURCE_URL}

# --- Keycloak (Local Docker instance) ---
# If Keycloak is running in Docker on your host machine, use 'localhost'
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.gitbounty.foo/realms/gitbounty

# --- Security & Auth ---
# Use the client ID and secret for your local realm
keycloak.client-id=gitbounty-backend
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# --- Swagger UI ---
# Set the server URL to localhost for local testing
springdoc.swagger-ui.oauth.clientId=gitbounty-frontend
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# Important: Map the oauth redirect properly for local dev
springdoc.swagger-ui.oauth.realm=gitbounty

# --- Server & Proxy ---
server.port=8081
server.forward-headers-strategy=FRAMEWORK

# --- Hibernate/Flyway ---
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.show-sql=true