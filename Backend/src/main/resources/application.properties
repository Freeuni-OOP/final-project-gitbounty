server.port=${SERVER_PORT:8081}
spring.docker.compose.enabled=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Security & Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gitbounty}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:gitbounty-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:gitbounty-backend-secret}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.user=${FLYWAY_USER:root}
spring.flyway.password=${FLYWAY_PASSWORD:root_password}
spring.flyway.default-schema=${FLYWAY_SCHEMA:gitbounty}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gitbounty}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev_password}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# App Paths
git.repositories-root=${GIT_REPOSITORIES_ROOT:repositories}

# Proxy Support
server.forward-headers-strategy=FRAMEWORK

# Swagger UI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.oauth.clientId=${SWAGGER_OAUTH_CLIENT_ID:gitbounty-frontend}
springdoc.swagger-ui.url=/v3/api-docs
# This allows Swagger to know the base URL of your API
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
