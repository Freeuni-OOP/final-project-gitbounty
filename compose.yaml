#    environment:
#      MYSQL_ROOT_PASSWORD: root
#      MYSQL_USER: ${DB_USER}
#      MYSQL_PASSWORD: ${DB_PASSWORD}
#      MYSQL_DATABASE: gitbounty
#    ports:
