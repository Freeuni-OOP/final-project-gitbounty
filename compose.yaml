services:
  backend:
    image: ghcr.io/freeuni-oop/gitbounty-backend:${BRANCH_NAME:-latest}
#    build:
#        context: ./Backend
#        dockerfile: ./Dockerfile
    container_name: gitbounty-backend
    restart: unless-stopped
    platform: linux/amd64
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GIT_REPOSITORIES_ROOT: /app/repositories
    ports:
      - "8081:8081"
    volumes:
      - gitbounty-repositories:/app/repositories
    env_file:
      - .env
    develop:
      watch:
        - path: Backend/src
          action: rebuild
    networks:
      - gitbounty-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8081/health > /dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 10
#
#  mysql:
